<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DemandRadar</title><style>body{font:15px system-ui;margin:0;background:#f5f5f5;color:#161616}main{max-width:1050px;margin:auto;padding:32px}h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:14px;border:1px solid #ddd}.score{font-size:28px;font-weight:800}.meta{color:#666}.bar{height:8px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#222}a{color:inherit}.examples{padding-left:18px}</style><main><h1>DemandRadar</h1><p id="meta" class="meta">Loading…</p><div id="grid" class="grid"></div></main><script>fetch('/data').then(r=>r.json()).then(d=>{meta.textContent=`${d.items.length} signals • query: ${d.query}`;grid.innerHTML=d.opportunities.slice(0,30).map((o,i)=>`<article class=card><div class=score>${o.opportunity_score}</div><h2>${esc(o.topic)}</h2><p class=meta>${o.mentions} mentions • ${o.engagement} engagement • ${o.sources.join(', ')}</p><div class=bar><i style="width:${Math.min(100,o.opportunity_score/2)}%"></i></div><ul class=examples>${o.examples.map(e=>`<li><a target=_blank href="${e.url}">${esc(e.title)}</a> <small>${e.source}</small></li>`).join('')}</ul></article>`).join('')});function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}</script>
