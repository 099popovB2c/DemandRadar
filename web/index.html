<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DemandRadar</title><style>body{font:15px system-ui;margin:0;background:#f5f5f5;color:#161616}main{max-width:1120px;margin:auto;padding:32px}h1{font-size:34px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{padding:9px;border:1px solid #ccc;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:14px;border:1px solid #ddd}.score{font-size:28px;font-weight:800}.meta{color:#666}.bar{height:8px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#222}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:11px;background:#eee;border-radius:99px;padding:3px 7px}a{color:inherit}.examples{padding-left:18px}.components{font-size:12px;color:#555}</style><main><h1>DemandRadar</h1><p id="meta" class="meta">Loading…</p><div class="controls"><input id="filter" placeholder="Filter topic…"><select id="source"><option value="">All sources</option><option>reddit</option><option>hn</option><option>github</option></select><select id="sort"><option value="score">Opportunity score</option><option value="intent">Demand intent</option><option value="mentions">Mentions</option></select></div><div id="grid" class="grid"></div></main><script>let data;const $=s=>document.querySelector(s);fetch('/data').then(r=>r.json()).then(d=>{data=d;$('#meta').textContent=`${d.items.length} unique signals • ${d.queries.join(' | ')}`;render()});['filter','source','sort'].forEach(id=>$('#'+id).oninput=render);function render(){if(!data)return;const q=$('#filter').value.toLowerCase(),src=$('#source').value,sort=$('#sort').value;let rows=data.opportunities.filter(o=>(!q||o.topic.toLowerCase().includes(q))&&(!src||o.sources.includes(src)));rows.sort((a,b)=>sort==='intent'?b.demand_intent-a.demand_intent:sort==='mentions'?b.mentions-a.mentions:b.opportunity_score-a.opportunity_score);$('#grid').innerHTML=rows.slice(0,60).map(o=>`<article class=card><div class=score>${o.opportunity_score}</div><h2>${esc(o.topic)}</h2><div class=chips>${o.sources.map(x=>`<span class=chip>${x}</span>`).join('')}</div><p class=meta>${o.mentions} mentions • ${o.engagement} engagement • intent ${o.demand_intent}/10 • freshness ${Math.round(o.freshness*100)}%</p><div class=bar><i style="width:${Math.min(100,o.opportunity_score)}%"></i></div><p class=components>Frequency ${o.components.frequency} · Engagement ${o.components.engagement} · Diversity ${o.components.source_diversity} · Intent ${o.components.intent}</p><ul class=examples>${o.examples.map(e=>`<li><a target=_blank rel=noopener href="${e.url}">${esc(e.title)}</a> <small>${e.source} · intent ${e.intent_score}</small></li>`).join('')}</ul></article>`).join('')||'<p>No matching opportunities.</p>'}function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}</script>
