<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DemandRadar</title>
  <style>
    body{font:15px system-ui;margin:0;background:#f5f5f5;color:#161616}
    main{max-width:1120px;margin:auto;padding:32px}
    h1{font-size:34px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
    .controls input,.controls select{padding:9px;border:1px solid #ccc;border-radius:9px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
    .card{background:white;padding:18px;border-radius:14px;border:1px solid #ddd}
    .score{font-size:28px;font-weight:800}.meta{color:#666}.bar{height:8px;background:#eee;border-radius:8px;overflow:hidden}
    .bar i{display:block;height:100%;background:#222}.chips{display:flex;gap:5px;flex-wrap:wrap}
    .chip{font-size:11px;background:#eee;border-radius:99px;padding:3px 7px}.alert{background:#fff4d6}
    .trend-rising{font-weight:700}.trend-falling{opacity:.75}a{color:inherit}.examples{padding-left:18px}
    .components{font-size:12px;color:#555}.error{padding:12px;background:#ffe6e6;border:1px solid #d99;border-radius:10px}
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <h1>DemandRadar</h1>
  <p id="meta" class="meta">Loading…</p>
  <div id="alerts"></div>
  <div class="controls">
    <input id="filter" placeholder="Filter topic…" aria-label="Filter topic">
    <select id="source" aria-label="Source"><option value="">All sources</option><option>reddit</option><option>hn</option><option>github</option></select>
    <select id="trend" aria-label="Trend"><option value="">All trends</option><option>new</option><option>rising</option><option>stable</option><option>falling</option></select>
    <select id="sort" aria-label="Sort"><option value="score">Opportunity score</option><option value="delta">Trend delta</option><option value="intent">Demand intent</option><option value="mentions">Mentions</option></select>
  </div>
  <div id="grid" class="grid"></div>
</main>
</body>
</html>
